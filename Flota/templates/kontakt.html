{% extends 'base.html' %}

{% block content %}
<body>
  <div class="card text-center">
    <div class="card-header">
      Kontakt
    </div>
    <div class="d-flex justify-content-center flex-column card-body">
      <form method="POST" action=''>
        {% csrf_token %}
      
      <div class="justify-content-center mb-4 row">
        <label for="exampleFormControlInput1" class="col-sm-3 col-lg-2 col-form-label">Twój adres e-mail</label>
        <div class="col-sm-7 col-lg-4">
          <input type="subject" class="form-control" name='email' id="exampleFormControlInput1" placeholder="nazwa@domena.pl">
        </div>
      </div>
      <div class="justify-content-center mb-4 row">
        <label for="exampleFormControlTextarea1" class="col-sm-3 col-lg-2 col-form-label">Treść wiadomości</label>
        <div class="col-sm-7 col-lg-4">
          <textarea class="form-control" name='subject' id="exampleFormControlTextarea1" rows="5" placeholder="tutaj wpisz treść swojej wiadomości"></textarea>
        </div>
      </div>
      <div class="justify-content-center mb-4 row">
        <label for="exampleFormControlTextarea2" class="col-sm-3 col-lg-2 col-form-label">Treść wiadomości</label>
        <div class="col-sm-7 col-lg-4">
          <textarea class="form-control" name='body' id="exampleFormControlTextarea2" rows="5" placeholder="tutaj wpisz treść swojej wiadomości"></textarea>
        </div>
      </div>
      <div class="col-sm-12">
      <button type="submit" class="btn btn-primary">Submit</button>
    </div>
    </div>
    <div class="card-footer text-muted">
      2 days ago
    </div>
  </div>
</form>
</body>    
    {%  endblock %}
